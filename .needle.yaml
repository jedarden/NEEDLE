agent:
  default: claude
  args: []
  timeout: 3600
  adapters_dir: /home/coding/.config/needle/adapters
  routing:
    rules:
    - match_model: (claude-)?(sonnet|opus|fable|haiku).*
      adapter: claude-print
    default_adapter: claude-code-glm-4.7
    strict: false
bead_cli:
  backend: bead-rs
worker:
  max_workers: 10
  launch_stagger_seconds: 2
  idle_timeout: 60
  idle_action: wait
  max_claim_retries: 3
  claim_race_lost_skip: 5
  identifier_scheme: hostname_random
  cpu_load_warn: 0.8
  memory_free_warn_mb: 512
  building_timeout: 600
workspace:
  default: /home/coding/NEEDLE
  home: /home/coding/.needle
  labels: []
strands:
  pluck:
    exclude_labels: []
    split_after_failures: 0
  mend:
    stuck_threshold_secs: 300
    lock_ttl_secs: 600
    db_check_interval: 50
    idle_timeout: 120
  explore:
    enabled: true
    workspaces: []
    workspace_root: /home/coding/
  knot:
    alert_destination: null
    alert_cooldown_minutes: 60
    exhaustion_threshold: 3
  mitosis:
    enabled: true
    first_failure_only: true
    force_failure_threshold: 0
    repeat_interval: 0
  weave:
    enabled: true
    max_beads_per_run: 5
    cooldown_hours: 24
    exclude_workspaces: []
    doc_patterns:
    - README*
    - AGENTS.md
    - docs/**/*
    prompt_template: null
  unravel:
    enabled: false
    max_beads_per_run: 5
    max_alternatives_per_bead: 3
    cooldown_hours: 168
    prompt_template: null
  pulse:
    enabled: true
    scanners:
      # File-based health checks (work even when code doesn't compile)
      - name: todo-comments
        command: grep -rn "TODO\|FIXME\|XXX\|HACK" src/ --include="*.rs" || true
        severity_threshold: 4
      - name: unwrap-usage
        command: grep -rn "\.unwrap()" src/ --include="*.rs" | grep -v "test\|test_modules" || true
        severity_threshold: 3
      - name: large-files
        command: find src/ -name "*.rs" -size +50k -exec ls -lh {} \; || true
        severity_threshold: 4
    max_beads_per_run: 3
    cooldown_hours: 24
    severity_threshold: 3
    prompt_template: null
  reflect:
    enabled: true
    min_beads_since_last: 10
    cooldown_hours: 24
    max_learnings_per_run: 10
    max_skills_per_run: 3
    learning_retention_days: 90
    max_learnings: 80
    extraction_agent: null
    extraction_prompt_template: null
    max_extraction_per_run: 5
    transcript_recency_days: 7
    transcript_max_sessions: 50
    drift_similarity_threshold: 0.6
    drift_enabled: true
    adr_enabled: true
    claude_md_placement: true
  splice:
    enabled: true
    stale_threshold_secs: 300
    report_workspace: /home/coding/NEEDLE
    detect_live_loops: true
    live_loop_scan_events: 200
    claim_churn_threshold: 20
    log_runaway_bytes: 10485760
    live_loop_window_secs: 300
  learning:
    trace_retention_failed_days: 30
    trace_retention_success_days: 7
    max_learnings: 80
    trace_sanitization:
      enabled: true
      custom_patterns: []
    global_learnings_file: /home/coding/.config/needle/global-learnings.md
    max_global_learnings: 40
telemetry:
  file_sink:
    enabled: true
    log_dir: null
    retention_days: 30
  stdout_sink:
    enabled: false
    format: normal
    color: auto
  hooks: []
  otlp_sink:
    enabled: true
    endpoint: http://needle-otel-ex44-apexalgo-iad-ts.ardenone.com:4318
    protocol: http
    timeout_secs: 10
    compression: gzip
    tls: none
    headers:
      - "Authorization: env:NEEDLE_OTLP_AUTHORIZATION"
    resource_attributes: []
    metrics_interval_secs: 10
    service_namespace: needle-fleet
    max_queue_size: 2048
prompt:
  context_files: []
  instructions: null
  templates: {}
  variants: {}
health:
  heartbeat_interval_secs: 30
  heartbeat_ttl_secs: 300
  heartbeat_dir: null
limits:
  providers: {}
  models: {}
pricing: {}
budget:
  warn_usd: 0.0
  stop_usd: 0.0
# NOTE: do not reintroduce a `verification:` mapping here. The workspace-level
# `verification` key is the LEGACY alias for `gates:` and must be a SEQUENCE of
# shell commands (WorkspaceOverrides.verification: Option<Vec<String>>, see
# src/config/mod.rs). A mapping makes this entire file fail to parse with
# "verification: invalid type: map, expected a sequence", which silently blocks
# EVERY new worker launch on this workspace — already-running workers keep going,
# so the breakage is invisible until you try to scale or restart the fleet.
# It shipped that way in 0bf3111 (2026-08-16 10:47) and capped NEEDLE at two
# workers for ~18h.
#
# `outcome_timeout_seconds` is NOT workspace-overridable; it lives on the global
# ValidationConfig in ~/.needle/config.yaml under `validation:`, where it has
# been set to 300. The `gates:` block below expresses this workspace's
# verification via the supported pluggable system.
#
# NEEDLE validation gate: Definition of Done (fast lane)
# This is the SAME command invoked by the pre-commit hook and CI verify step,
# ensuring a single source of truth for "is this work acceptable?"
# See scripts/definition-of-done.sh for the unified verification command.
# The fast lane runs locally in seconds: fmt, clippy, check.
gates:
  - type: command
    commands:
      - scripts/definition-of-done.sh --fast
self_modification:
  enabled: false
  canary_workspace: /home/coding/.needle/canary
  auto_promote: false
  canary_timeout: 300
  hot_reload: true
fabric:
  enabled: true
  endpoint: http://needle-feed-ex44-apexalgo-iad-ts.ardenone.com/ingest
  timeout: 2
  batching: false
supervisor:
  heartbeat_path: null
  socket_path: null
