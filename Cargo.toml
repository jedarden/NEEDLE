[workspace]
members = ["crates/needle-learning"]
resolver = "2"

[package]
name = "needle"
version = "0.6.15"
edition = "2021"
# MSRV — enforced by needle-ci's verify-msrv lane (iad-ci), which builds and
# unit-tests under exactly this toolchain and fails the run if it drifts from
# the lane's MSRV_TOOLCHAIN. Move both in the same change.
rust-version = "1.88"
autotests = false
description = "Navigates Every Enqueued Deliverable, Logs Effort"
license = "MIT"

[lib]
name = "needle"
path = "src/lib.rs"

[[bin]]
name = "needle"
path = "src/main.rs"

[[bin]]
name = "needle-transform-claude"
path = "src/bin/needle_transform_claude.rs"

[[bin]]
name = "needle-transform-codex"
path = "src/bin/needle_transform_codex.rs"

[[bin]]
name = "needle-transform-opencode"
path = "src/bin/needle_transform_opencode.rs"

[[bin]]
name = "needle-transform-omp"
path = "src/bin/needle_transform_omp.rs"

[features]
default = ["otlp"]
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tonic",
    "dep:tracing-opentelemetry",
]
integration = [
    "otlp",
    "testcontainers",
]
# Load-simulation harness in src/integration_t/. Off by default — it does not
# currently build inside the library; see the doc comment on the module in
# src/lib.rs for what is outstanding.
integration-t = []

[dependencies]
# The learning kernel is an internal, dependency-isolated library.  Keeping it
# as a normal dependency makes it part of the NEEDLE release artifact while
# the workspace member also permits direct kernel checks and tests.
needle-learning = { path = "crates/needle-learning", version = "0.6.6" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the default float parser is fast but not exactly
# round-tripping, so a 17-significant-digit value written to an append-only
# record reads back as a different f64 (a measured delta of
# 0.39999999999999997 came back 0.4). Impact receipts are audit records that
# must read back byte-identical after a restart, so exactness wins here.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging / telemetry
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Process management
which = "4"

# Async traits
async-trait = "0.1"

# Cross-platform file locking (flock)
fs2 = "0.4"

# Hashing (prompt content hash, binary fingerprinting for hot-reload)
sha2 = "0.10"
hex = "0.4"

# Regex (agent token extraction)
regex = "1"

# Glob pattern matching (doc file discovery)
glob = "0.3"

# HTTP client (self-update)
ureq = "2"

# Multi-pattern string search (sanitizer keyword pre-filter)
aho-corasick = "1"

# Conditional compilation
cfg-if = "1"

# Terminal detection (ANSI color support)
atty = "0.2"

# TOML parsing (gitleaks config)
toml = "0.8"

# Unix process handling (PID liveness check)
libc = "0.2"

# Random jitter (backoff desynchronization)
rand = "0.8"

# UUIDv7 provisional attempt IDs (plan 4.4 step 1; N-T16). v7 embeds a
# unix-millisecond timestamp so ledger rows sort by dispatch start.
uuid = { version = "1", features = ["v7"] }

# Temporary directories (checkpoint test utilities)
tempfile = "3"

# OpenTelemetry / OTLP (gated behind `otlp` feature)
opentelemetry = { version = "0.31", optional = true }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "http-proto", "gzip-tonic", "gzip-http"], optional = true }
opentelemetry-semantic-conventions = { version = "0.31", optional = true }
tonic = { version = "0.14", optional = true }

# Additional OTLP dependencies
tracing-opentelemetry = { version = "0.32", optional = true }
futures = "0.3"
gethostname = "0.4"

# Integration test dependencies
testcontainers = { version = "0.23", optional = true }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
filetime = "0.2"
criterion = "0.5"
serial_test = "3"
scopeguard = "1"
os_pipe = "1"

[[test]]
name = "integration_spawn"
path = "tests/integration_spawn.rs"
harness = true

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
harness = true

[[test]]
name = "p2_integration_tests"
path = "tests/p2_integration_tests.rs"
harness = true

[[test]]
name = "p3_integration_tests"
path = "tests/p3_integration_tests.rs"
