[[test]]
name = "nt10_context_adapter_parity"
path = "tests/nt10_context_adapter_parity.rs"
harness = true

[[test]]
name = "nt10_policy_doctor"
path = "tests/nt10_policy_doctor.rs"
harness = true

[[test]]
name = "nt10_policy_admission"
path = "tests/nt10_policy_admission.rs"
harness = true

[[test]]
name = "nt51_gateway_health"
path = "tests/nt51_gateway_health.rs"
harness = true

[[test]]
name = "nt52_state_dir_isolation"
path = "tests/nt52_state_dir_isolation.rs"
harness = true

[[test]]
name = "nt07_admission_policy"
path = "tests/nt07_admission_policy.rs"
harness = true

[[test]]
name = "nt07_admission_budgets"
path = "tests/nt07_admission_budgets.rs"
harness = true

[[test]]
name = "nt53_improvement_proposals"
path = "tests/nt53_improvement_proposals.rs"
