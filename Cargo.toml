[[test]]
name = "nt54_proposal_admission"
path = "tests/nt54_proposal_admission.rs"
harness = true

[[test]]
name = "nt55_impact_receipts"
path = "tests/nt55_impact_receipts.rs"
harness = true

[[test]]
name = "nt56_improvements_cli"
path = "tests/nt56_improvements_cli.rs"
