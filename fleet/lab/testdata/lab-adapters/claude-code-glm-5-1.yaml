name: claude-code-glm-5-1
description: Claude Code via ZAI proxy (GLM-5.1 primary and subagent)
agent_cli: claude
version_command: "/home/coding/.local/bin/claude --version"
input_method:
  method: stdin
invoke_template: systemd-run --user --scope --slice=needle.slice -p CPUWeight=100 -p MemoryMax=4G bash -c 'cd {workspace} && git rev-parse HEAD > .needle-predispatch-sha 2>/dev/null; VITEST_MAX_THREADS=2 VITEST_MAX_FORKS=2 GOMAXPROCS=4 GOFLAGS=-p=2 NODE_TLS_REJECT_UNAUTHORIZED='\''0'\'' ANTHROPIC_BASE_URL='\''https://traefik-apexalgo-iad.tail1b1987.ts.net:8444'\'' ANTHROPIC_AUTH_TOKEN='\''proxy-handles-auth'\'' ANTHROPIC_MODEL='\''glm-5.1'\'' ANTHROPIC_DEFAULT_OPUS_MODEL='\''glm-5.1'\'' ANTHROPIC_DEFAULT_SONNET_MODEL='\''glm-5.1'\'' ANTHROPIC_DEFAULT_HAIKU_MODEL='\''glm-5.1'\'' CLAUDE_CODE_SUBAGENT_MODEL='\''glm-5.1'\'' DISABLE_AUTOUPDATER=1 DISABLE_TELEMETRY=1 /home/coding/.local/bin/claude --print --verbose --output-format stream-json --include-partial-messages --model claude-sonnet-4-6 --max-turns 30 --dangerously-skip-permissions < {prompt_file}'
environment: {}
idle_timeout_secs: 900
hard_timeout_secs: 0
provider: zai
model: glm-5.1
token_extraction:
  method: json_field
  input_path: "result.usage.input_tokens"
  output_path: "result.usage.output_tokens"
