version = 1

# These ceilings are deliberate review gates, not aspirational coverage goals.
# Raise one only when a reviewer agrees that the named tier is the cheapest
# correct home for the added behavior. Counts are literal Rust test attributes.
[unit]
max_tests = 3870

[tier_budget]
push = 650
contract = 67
e2e = 634
soak = 0
fuzz = 0

[[harness]]
name = "integration_spawn"
path = "tests/integration_spawn.rs"
tier = "e2e"
max_tests = 262
owner = "component:process-integration"

[[harness]]
name = "integration_tests"
path = "tests/integration_tests.rs"
tier = "push"
max_tests = 545
owner = "component:core-integration"

[[harness]]
name = "p2_integration_tests"
path = "tests/p2_integration_tests.rs"
tier = "push"
max_tests = 105
owner = "component:pluck-mend-explore"

[[harness]]
name = "p3_integration_tests"
path = "tests/p3_integration_tests.rs"
tier = "e2e"
max_tests = 372
owner = "component:weave-unravel-pulse"

[[harness]]
name = "real_br_integration_tests"
path = "tests/real_br_integration_tests.rs"
tier = "contract"
max_tests = 67
owner = "component:bead-rs-contract"

# These are strict ceilings on existing debt. A new occurrence fails the fast
# lane; deleting an occurrence makes the corresponding exception stale so the
# policy shrinks with the implementation.
