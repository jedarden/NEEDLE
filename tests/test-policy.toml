# Files under tests/ that are not compiled into a Rust harness are still test
# assets. Each must match a rule with a durable component owner.
[[artifact]]
pattern = "tests/*.md"
owner = "component:test-documentation"

[[artifact]]
pattern = "tests/*.sh"
owner = "component:shell-verification"

[[artifact]]
pattern = "tests/cargo-targets/*"
owner = "component:cargo-target-policy"

