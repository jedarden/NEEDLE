# These ceilings are deliberate review gates, not aspirational coverage goals.
# Raise one only when a reviewer agrees that the named tier is the cheapest
# correct home for the added behavior. Counts are literal Rust test attributes.
[unit]
# +3 for the launch-timestamp telemetry emission coverage (needle-d6864d47):
# start_telemetry_survives_command_failure_to_start,
# start_telemetry_timestamp_matches_outcome_record,
# start_telemetry_is_noop_without_an_emitter.
# +1 for state_machine_tests_neutralize_the_launch_admission_gate: the unit tier
# is the only place that can read this module's own source, and the rule it
# enforces is what kept the lib tier intermittently red.
# +23 for the Resolve DecisionExecutor ownership-guard suite (needle-f0fd0685).
# +10 for the log-prune unit suite (needle-daab3ee2).
# +5 for dispatch-time verification through the resolved target-workspace store
# (needle-828a425c): three collision/routing suites in src/claim/mod.rs that need
# two fixture stores in one process, plus two Worker::resolve_target_store tests
# (context identity and the missing-context refusal) that read the Worker's own
# private field.
# +4 for the injectable worker clock boundary (needle-93ec59e8): three focused
# clock contracts plus one Worker retry-policy test. These belong in the unit
# tier because the seam is process-local and the proof must inspect a pending
# future before advancing manual time.
# -11 process-spawning archive/status/version/canary contracts moved to the
# integration_spawn harness (needle-a9bdc4e1).
# -81 backend identity, capability, PATH, configuration, and CLI process cases
# consolidated into seven integration_spawn contracts (needle-83163936),
# including bounded real-ETXTBSY recovery at both version-probe boundaries.
# -49 real adapter-shell and telemetry hook contracts moved to integration_spawn
# (needle-2f470c02).
# -8 Pulse scanner process contracts moved to integration_spawn
# (needle-b3a720b7); Worker/Knot/Mend state tests remain in-process.
# -26 Resolve, outcome, Mitosis timeout-context, and retrieval real-process
# cases consolidated into 15 integration_spawn contracts (needle-6a36c428).
# +3 gate-health persistence safety contracts (needle-0ed0ccd0): durable HOME
# rejects temp-root recording, stale pruning preserves real records, and the
# doctor repair surface remains scoped to missing workspaces.
# +2 fail-closed claim verification (needle-40ca2f6e): store-error abort with
# category telemetry, and the error-text category classifier.
# +12 attempt accounting, N-T46 (needle-16657d72): six pure decomposition-rule
# contracts in src/attempt_accounting.rs, one exclusion case each for stats,
# evidence routing and experiments, v2 fixture conformance of a decomposed
# row, and two OutcomeHandler ledger-row cases (split template; new split
# parent without commits). The bead named a dedicated `--test` target, but the
# explicit five-target boundary (tests/cargo-targets) makes the unit tier the
# cheapest correct home; the acceptance command is `cargo test --lib nt46_`.
# +8 attempt accounting, N-T47 (needle-ec41ceba): four stream-usage contracts
# in src/attempt_accounting.rs (killed transcript charged, envelope reconciled
# exactly, no usage uncosted, repeated and interleaved reports counted once),
# two pricing cases in src/cost (cache rates, fleet GLM defaults), stats
# treating uncosted rows as unknown, and the always-serialized costed flag.
# All pure; `cargo test --lib nt47_` stands in for the bead's dedicated target.
# +4 workspace-scoped routing evidence, N-T48 (needle-f84c01a4): per-workspace
# replay routing, the once-per-window poor-workspace signal, scope off equals
# the fleet choice, and freeze/degraded/default-floor guards. Pure;
# `cargo test --lib nt48_`.
# +3 workspace-only routing candidates, N-T61 (needle-54699c67): withheld at
# fleet scope, still chosen on workspace evidence, never explored. Pure;
# `cargo test --lib nt61_`.
# +11 reserved Pluck lanes, N-T59 (needle-bc162127): six Pluck selection
# contracts (lane bead over an unlabelled P0 while an ordinary worker still
# takes the P0, order preserved inside the lane, no relaxed tier handing a lane
# worker unlabelled work, safety exclusions still applying inside a lane, empty
# lane idling and falling back under when_empty: normal with lane_empty
# telemetry), one Explore admission contract, three config contracts (roster
# matching, empty default, when_empty YAML default) and the live-reload tier.
# All in-process; `cargo test --lib nt59_` is the bead's acceptance command.
# +12 factory-health predicate group, N-T57 (needle-76b52674): ten predicate
# contracts in src/cli/audit/factory.rs — a firing fixture and a healthy-state
# fixture for each of F1–F4, the informational I_CHECKLIST_DRIFT case, and the
# group-registration/clean-run case — plus two CI run-history contracts in
# src/build_status.rs (failed-Pod-node parsing with the message fallback, and
# newest-first ordering including the trait's default single-run history).
# The unit tier is the cheapest correct home because every one of them is a
# pure function of a fixture context; the explicit five-target boundary
# (tests/cargo-targets) rules out a dedicated harness. Acceptance command:
# `cargo test --lib nt57_`.

# +12 audit CLI, telemetry and bead filing, N-T58 (needle-e42f3f0b): ten
# filing-policy contracts in src/cli/audit/filing.rs (signature stability and
# scoping, informational never filed, the per-run budget, notes not being
# budgeted, intra-run duplicates, the create-then-note sequence over two runs,
# label shape including never-`human`, closed beads not suppressing a new one,
# owning-store fallback, and the bounded repeat note) plus two telemetry-shape
# contracts in src/cli/audit.rs. All pure or against an in-memory store — the
# `--lib` harness may not spawn a process (tests/lib-process-purity).
# Acceptance command: `cargo test --lib nt58_`.

# +10 learning-loop stall and escalation handoff, N-T60 (needle-e0ad35bd):
# five F5 predicate contracts in src/cli/audit/factory.rs (fires on a
# four-day-old newest close, quiet on a close inside the window, quiet without
# an open unassigned loop bead, the home-workspace default, and the
# longest-waiting-first ordering carrying priority and age), three brief
# contracts in src/cli/audit/escalation.rs (content, rewritten-not-duplicated,
# and a path-safe name), one filing contract for the `escalation` label and the
# brief path in the bead body, and one Pluck default-exclusion contract in
# src/strand/pluck.rs. All pure or against a tempdir and an in-memory store.
# Acceptance command: `cargo test --lib nt60_`.
# +5 Phase 19.7 dependency cycle-breaking contracts (needle-af2bb4f0): the
# A→B→C→A acceptance fixture (newest edge removed, both beads noted,
# mend.cycle_broken telemetry), second-pass idempotence, the equal-timestamp
# tie-break on the lexically largest blocked id, an acyclic-graph no-op, and
# detect_cycles finding each distinct cycle. Private MendStrand helpers; the
# explicit five-target boundary (tests/cargo-targets) makes the unit tier the
# cheapest correct home; the acceptance command is
# `cargo test --lib break_dependency_cycles`.
# +4 circuit-breaker contracts (needle-f74d0110): Forgejo status mapping and
# repository parsing, fake red/green policy admission, and P0 fix-bead
# creation/deduplication. These are in-process and belong in the unit tier.
max_tests = 3835

