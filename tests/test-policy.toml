# Files under tests/ that are not compiled into a Rust harness are still test
# assets. Each must match a rule with a durable component owner.
[[artifact]]
pattern = "tests/*.md"
owner = "component:test-documentation"

[[artifact]]
pattern = "tests/*.sh"
owner = "component:shell-verification"

[[artifact]]
pattern = "tests/cargo-targets/*"
owner = "component:cargo-target-policy"

[[artifact]]
pattern = "tests/dod-attribution/*"
owner = "component:definition-of-done"

[[artifact]]
pattern = "tests/dod-modes/*"
owner = "component:definition-of-done"

[[artifact]]
pattern = "tests/e2e/*"
owner = "component:e2e"

[[artifact]]
pattern = "tests/fixtures/*"
owner = "component:test-fixtures"

[[artifact]]
pattern = "tests/helpers/*"
owner = "component:test-infrastructure"

[[artifact]]
pattern = "tests/install_sh/*"
owner = "component:installer"

[[artifact]]
pattern = "tests/installer/*"
owner = "component:installer"

[[artifact]]
pattern = "tests/integration/*"
owner = "component:shell-integration"

[[artifact]]
pattern = "tests/pending/*"
owner = "component:test-debt"

[[artifact]]
pattern = "tests/test-policy/*"
owner = "component:test-policy"
