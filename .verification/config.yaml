version: "1.0"
description: "NEEDLE project verification configuration"

fast_lane:
  - name: "Format check"
    command: "cargo"
    args: ["fmt", "--check"]
    timeout: 30
    description: "Verify code formatting"

  - name: "Clippy linting"
    command: "cargo"
    args: ["clippy", "--all-targets", "--", "-D", "warnings"]
    timeout: 60
    description: "Run clippy lints"

slow_lane:
  - name: "Unit tests"
    command: "cargo"
    args: ["test", "--lib"]
    timeout: 300
    description: "Run unit tests"
