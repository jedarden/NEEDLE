version: "1.0"
description: "NEEDLE project verification configuration"

# Fast lane: Quick checks that complete in under 2 minutes
# These are ideal for pre-commit validation and quick feedback
fast_lane:
  - name: "Format check"
    command: "cargo"
    args: ["fmt", "--check"]
    timeout: 30
    description: "Verify code formatting with rustfmt"

  - name: "Clippy linting"
    command: "cargo"
    args: ["clippy", "--all-targets", "--", "-D", "warnings"]
    timeout: 60
    description: "Run clippy lints with deny warnings"

  - name: "Cargo check"
    command: "cargo"
    args: ["check"]
    timeout: 60
    description: "Verify compilation without running tests"

# Slow lane: Full test suite that may take several minutes
# These mirror NEEDLE's named CI verification targets.
slow_lane:
  - name: "Build test targets"
    command: "cargo"
    args: ["test", "--no-run", "--lib", "--test", "integration_tests", "--test", "p2_integration_tests", "--test", "p3_integration_tests", "--test", "real_br_integration_tests"]
    timeout: 1800
    description: "Compile every test target before timed test runs"

  - name: "Unit tests"
    command: "cargo"
    args: ["test", "--lib"]
    timeout: 900
    description: "Run library unit tests"

  - name: "Core integration tests"
    command: "cargo"
    args: ["test", "--test", "integration_tests"]
    timeout: 900
    description: "Run core strand integration tests"

  - name: "P2 integration tests"
    command: "cargo"
    args: ["test", "--test", "p2_integration_tests"]
    timeout: 900
    description: "Run Mend and Explore integration tests"

  - name: "P3 integration tests"
    command: "cargo"
    args: ["test", "--test", "p3_integration_tests"]
    timeout: 900
    description: "Run Weave, Unravel, Pulse, and Knot integration tests"

  - name: "Real bead-rs integration tests"
    command: "cargo"
    args: ["test", "--test", "real_br_integration_tests"]
    timeout: 900
    description: "Run integration tests against the real bead-rs backend"

  - name: "Installer tests"
    command: "bash"
    args: ["tests/installer/run.sh"]
    timeout: 60
    description: "Run isolated installer regression tests"
