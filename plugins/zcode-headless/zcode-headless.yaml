name: zcode-headless
description: "ZCode Agent headless development using the model selected in ZCode settings"
agent_cli: needle-zcode-headless
version_command: "needle-zcode-headless --version"
input_method:
  method: file
  path_template: "{prompt_file}"
invoke_template: "needle-zcode-headless --workspace '{workspace}' --prompt-file '{prompt_file}' --mode yolo --max-turns 100"
environment: {}
timeout_secs: 0
idle_timeout_secs: 900
hard_timeout_secs: 7200
provider: zai
model: zcode-selected
token_extraction:
  method: none
harness: zcode
