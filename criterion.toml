# Criterion.rs configuration for NEEDLE benchmarks
# Configures output format and plotting backend
# See: https://bheisler.github.io/criterion.rs/book/cargo_criterion/configuring_cargo_criterion.html

# Override the directory where Criterion saves data and generates reports
criterion_home = "./target/criterion"

# Configure command-line output format
# Options: criterion (default), quiet, verbose, bencher
output_format = "verbose"

# Configure plotting backend (used by cargo-criterion for report generation)
# Options: "gnuplot", "plotters", "auto"
ploting_backend = "auto"

# Configure measurement settings
# Default sample size for benchmarks (higher = more accurate but slower)
default_sample_size = 10

# Warm-up time in seconds (allows CPU to reach steady state)
warm_up_time = 3

# Measurement time in seconds (how long to collect samples)
measurement_time = 5

# Configure which percentiles to report in output
# Criterion.rs automatically calculates percentiles; verbose output includes them
# Percentiles are available in the generated reports at target/criterion/
