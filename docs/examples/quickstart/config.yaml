# Minimal worker config for quickstart example
# Place this at ~/.config/needle/config.yaml — ONLY inside the sandbox HOME from
# Step 0 of the quickstart README. On a real NEEDLE host this file IS the fleet
# config; overwriting it with this example took an ex44 fleet down to one worker
# on 2026-08-30.

agent:
  default: claude
  timeout: 300  # 5 minute timeout per bead

worker:
  max_workers: 1           # Only one worker for this example
  idle_timeout: 30         # Check for work every 30 seconds
  idle_action: exit        # Exit when no work remains
  identifier_scheme: sequential   # Use sequential identifiers (worker-1, worker-2, ...)
